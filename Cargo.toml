[package]
name = "bwoc-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native desktop chat for BWOC agents — one agent or a whole team in one window. Renders the bwoc-harness --chat (chat_proto) stream in an egui window."
license = "MIT"

[[bin]]
name = "bwoc-chat"
path = "src/main.rs"

[dependencies]
# Single source of truth for the chat protocol + manifest/agent resolution.
bwoc-core = { path = "../bwoc-framework/crates/bwoc-core" }
eframe = "0.29"
egui_commonmark = "0.18"
serde_json = "1"
